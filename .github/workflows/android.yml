name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore stable debug keystore
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Stable keystore restored"
          else
            echo "DEBUG_KEYSTORE_B64 not set, using default debug key"
          fi

      - name: Install npm dependencies
        run: npm install

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chao-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
